name: Build Nave prerelease

on:
  push:
    branches:
      - main
    tags:
      - 'v*-beta.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        shell: pwsh
        run: dotnet publish NaveBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/Nave.exe -DestinationPath artifacts/Nave-win-x64.zip

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Nave-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nave-win-x64.zip" | Out-File artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Save release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nave-release-assets
          path: |
            artifacts/Nave-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: nave-release-assets
          path: artifacts

      - name: Publish as prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Nave ${{ github.ref_name }}
          prerelease: true
          files: |
            artifacts/Nave-win-x64.zip
            artifacts/SHA256SUMS.txt
